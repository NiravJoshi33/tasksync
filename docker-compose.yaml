services:
  tasksync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # These values will be picked up from your .env file by Docker Compose
        - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
        - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME}
        - GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON=${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON}
        - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
        - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
    ports:
      - '7823:7823'
    env_file:
      - .env
    environment:
      - PORT=7823 # Uncommon port chosen to avoid conflicts with other dev services
    restart: unless-stopped

    # Join the shared proxy network so the local-proxy (Caddy) stack can reach
    # this service as "tasksync:7823" and serve it at http://tasksync.local
    networks:
      - default
      - web

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  web:
    external: true
